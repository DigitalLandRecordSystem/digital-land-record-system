{% extends "base.html" %}
{% block title %}Verification{% endblock %}
{% block content %}
<h1>Verification</h1>
<p class="note">Step 2 of 2 &mdash; one-time code. Your password alone grants no access.</p>
<form method="post" class="card">
  <label>Six-digit code
    <input name="code" required autofocus inputmode="numeric"
           pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code"></label>
  <button type="submit">Verify</button>
</form>
<p class="note">We emailed a code to <strong>{{ address }}</strong>.
   It expires in five minutes and can be used once.</p>
<form method="post">
  <input type="hidden" name="action" value="resend">
  <button type="submit" class="link">Send a new code</button>
</form>
{% endblock %}
